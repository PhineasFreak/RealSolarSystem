//  ================================================================================
//  Use the Mitchell-Netravali height map PQS mod to improve surface appearance.
//
//  https://github.com/pkmniako/Kopernicus_VertexMitchellNetravaliHeightMap
//  ================================================================================

@Kopernicus:AFTER[RealSolarSystem]:NEEDS[VertexMitchellNetravaliHeightMap]
{
    @Body:HAS[~name[Jupiter],~name[Saturn],~name[Uranus],~name[Neptune]],*
    {
        @PQS
        {
            @Mods
            {
                %VertexMitchellNetravaliHeightMap
                {
                    %map = #$../VertexHeightMap/map$
                    %offset = #$../VertexHeightMap/offset$
                    %deformity = #$../VertexHeightMap/deformity$
                    %scaleDeformityByRadius = false
                    %B = 1
                    %C = 0
                    %order = 10
                    %enabled = true
                }

                !VertexHeightMap,*{}
            }
        }
    }
}
