//  ================================================================================
//  Custom Principia gravity models and initial states. These cover celestial bodies
//  that are not included with base Principia. The list of bodies include:
//
//  - Hydra
//  - Hyperion
//  - Kerberos
//  - Nix
//  - Proteus
//  - Styx
//
//  The standard gravitational parameters were taken from the SPICE kernel for
//  DE440: https://naif.jpl.nasa.gov/pub/naif/generic_kernels/pck/gm_de440.tpc
//
//  In the case of Styx, were the GM is unknown, the GM of Kerberos is used.
//
//  The RA and DEC values were taken from the SPICE kernel constants pck00011:
//  https://naif.jpl.nasa.gov/pub/naif/generic_kernels/pck/pck00011.tpc
//
//  For bodies with unknown RA and DEC values these parameters are set to zero.
//  ================================================================================

@principia_gravity_model:FOR[RealSolarSystem]:NEEDS[Principia]
{
    body
    {
        name                    = Hydra
        gravitational_parameter = 3.211039206155255E-03 km^3/s^2
        reference_instant       = JD2451545.000000000
        mean_radius             = 18.5 km
        axis_right_ascension    = 0 deg
        axis_declination        = 0 deg
        reference_angle         = 0 deg
        angular_frequency       = 838.183935 deg / d
    }

    body
    {
        name                    = Hyperion
        gravitational_parameter = 3.718791714191668E-01 km^3/s^2
        reference_instant       = JD2451545.000000000
        mean_radius             = 135.0 km
        axis_right_ascension    = 0 deg
        axis_declination        = 0 deg
        reference_angle         = 0 deg
        angular_frequency       = 0.010000 deg / d
    }

    body
    {
        name                    = Kerberos
        gravitational_parameter = 1.110040850536676E-03 km^3/s^2
        reference_instant       = JD2451545.000000000
        mean_radius             = 6.0 km
        axis_right_ascension    = 0 deg
        axis_declination        = 0 deg
        reference_angle         = 0 deg
        angular_frequency       = 67.796611 deg / d
    }

    body
    {
        name                    = Nix
        gravitational_parameter = 3.048175648169760E-03 km^3/s^2
        reference_instant       = JD2451545.000000000
        mean_radius             = 18.0 km
        axis_right_ascension    = 42.0 deg
        axis_declination        = 350.0 deg
        reference_angle         = 0 deg
        angular_frequency       = 196.828868 deg / d
    }

    body
    {
        name                    = Proteus
        gravitational_parameter = 2.583422379120727E+00 km^3/s^2
        reference_instant       = JD2451545.000000000
        mean_radius             = 209.0 km
        axis_right_ascension    = 299.27 deg
        axis_declination        = 42.91 deg
        reference_angle         = 93.38 deg
        angular_frequency       = 358.174718 deg / d
    }

    body
    {
        name                    = Styx
        gravitational_parameter = 1.110040850536676E-03 km^3/s^2
        reference_instant       = JD2451545.000000000
        mean_radius             = 5.2 km
        axis_right_ascension    = 0 deg
        axis_declination        = 0 deg
        reference_angle         = 0 deg
        angular_frequency       = 111.111111 deg / d
    }
}

