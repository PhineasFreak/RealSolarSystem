//  ================================================================================
//  Custom Principia gravity models and initial states. These cover celestial bodies
//  that are not included with base Principia. The list of bodies include:
//
//  - Hyperion
//
//  The standard gravitational parameters were calculated manually from the mass
//  value of each body.
//  ================================================================================

@principia_gravity_model:FOR[RealSolarSystem]:NEEDS[Principia]
{
    body
    {
        name                    = Hyperion
        gravitational_parameter = 0.0037507662 km^3/s^2
        reference_instant       = JD2451545.000000000
        mean_radius             = 135 km
        axis_right_ascension    = 0 deg
        axis_declination        = 0 deg
        reference_angle         = 0 deg
        angular_frequency       = 27.692 deg / d
    }
}

@principia_initial_state:FOR[RealSolarSystem]:NEEDS[Principia]
{
    body
    {
        name = Hyperion
        x    = -1.346622171730682E+09 km
        y    = +3.236420052365199E+08 km
        z    = +1.920510215445022E+08 km
        vx   = +1.647396175139850E+00 km/s
        vy   = -6.404202619995386E+00 km/s
        vz   = -4.052949909267151E+00 km/s
    }
}
