//  ================================================================================
//  Custom surface material properties.
//  ================================================================================

@Kopernicus:AFTER[RealSolarSystem]
{
    @Body,*
    {
        @PQS
        {
            %PhysicsMaterial
            {
                %bounceCombine = Minimum
                %frictionCombine = Maximum
                %bounciness = 0
                %staticFriction = 1.0
                %dynamicFriction = 1.0
            }
        }
    }
}
